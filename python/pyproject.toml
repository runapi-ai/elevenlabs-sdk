[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-elevenlabs"
version = "0.2.0"
description = "RunAPI ElevenLabs SDK for text-to-speech, dialogue generation, sound effects, speech transcription, and audio isolation workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "elevenlabs", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "audio-generation", "speech-to-text", "text-to-speech", "elevenlabs-api"]
dependencies = ["runapi-core>=0.3.1"]

[project.urls]
Homepage = "https://runapi.ai/models/elevenlabs"
Documentation = "https://runapi.ai/docs#sdk-elevenlabs"
Source = "https://github.com/runapi-ai/elevenlabs-sdk"
Issues = "https://github.com/runapi-ai/elevenlabs-sdk/issues"
Changelog = "https://github.com/runapi-ai/elevenlabs-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/elevenlabs-sdk/releases/tag/python%2Fv0.2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "elevenlabs"
