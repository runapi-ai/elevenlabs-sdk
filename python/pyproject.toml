[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-elevenlabs"
version = "0.1.0"
description = "ElevenLabs speech, dialogue, sound, and audio client for RunAPI"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "elevenlabs", "text-to-speech", "speech-to-text", "audio", "ai", "sdk"]
dependencies = ["runapi-core"]

[project.urls]
Homepage = "https://runapi.ai/models/elevenlabs"
Documentation = "https://runapi.ai/docs#sdk-elevenlabs"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[tool.uv.sources]
runapi-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "elevenlabs"
